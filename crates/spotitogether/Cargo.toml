[package]
name = "spotitogether"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
client = { version = "0.1.0", path = "../client" }
directories = "6.0.0"
game = { version = "0.1.0", path = "../game" }
keyring = "4.2.0"
open = "5.4.5"
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
server = { version = "0.1.0", path = "../server" }
spotify = { version = "0.1.0", path = "../spotify" }
tokio = { version = "1.54.1", features = ["full", "macros", "rt-multi-thread"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tui = { version = "0.1.0", path = "../tui" }
