[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3.34"
iroh = { version = "1.4.1", default-features = false, features = ["portmapper", "tls-aws-lc-rs"] }
protocol = { version = "0.1.0", path = "../protocol" }
serde_json = "1.0.154"
spotify = { version = "0.1.0", path = "../spotify" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"

[dev-dependencies]
server = { path = "../server" }
