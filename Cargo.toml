[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# `cargo run` (debug): dependencies (images, FFT, iroh, ratatui…) are built
# optimised and without debug info, our own crates stay debuggable. Much
# faster at run time, a much smaller binary, quicker links.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The software renderer is too slow unoptimised to judge the frame rate.
[profile.dev.package.game]
opt-level = 3
