name: Release

# Pousser un tag vX.Y.Z construit le binaire Linux x86_64 et crée la release
# GitHub utilisée par le paquet AUR spotitogether-bin.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bibliothèque son (capture du visualiseur)
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p spotitogether
      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="spotitogether-${version}-x86_64-linux"
          mkdir "$dir"
          cp target/release/spotitogether README.md LICENSE deploy/spotitogether.service deploy/spotitogether.desktop "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            spotitogether-*.tar.gz
            spotitogether-*.tar.gz.sha256
          generate_release_notes: true
